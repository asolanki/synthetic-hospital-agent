# Synthetic Hospital simulator for this project.
#
# Differs from the upstream compose file in two ways: the benchmark database is baked
# into the image (target `with-data`) so no host bind mount is needed, and only the app
# port is published, on 58000, to stay clear of other local stacks.
#
#   hospital/setup.sh                                     # clone upstream, then the line below
#   docker compose -f hospital/compose.yaml up -d --build
#   docker compose -f hospital/compose.yaml logs -f app   # "database ready: 1268 patients"
#
# `shrl` (synthetic-hospital-rl) is only the compose project name. Changing it would
# orphan the existing Postgres volume and force a full database reload.
name: shrl

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: epic_sim
      POSTGRES_USER: epic_sim
      POSTGRES_PASSWORD: dev_password
    shm_size: "256m"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epic_sim"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ../external/synthetic_hospital
      target: with-data
    image: shrl/synthetic-hospital:1.3-data
    ports:
      - "${SH_PORT:-58000}:8000"
    environment:
      EPIC_SIM_SCORER_TOKEN: ${EPIC_SIM_SCORER_TOKEN:-dev-scorer-token-change-in-production}
      # Keep the upstream default (ICD-10-CM fetched from CMS on first boot). The
      # patient_diagnosis reward depends on it: chart-neutral sets fall back to fuzzy
      # matching against ICD-10-CM titles in terminology_codes, so an empty table
      # changes scores. `python -m audit.verify` checks the table is populated.
      EPIC_SIM_LOAD_TERMINOLOGY: auto
      EPIC_SIM_DOWNLOAD_ICD10: auto
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
