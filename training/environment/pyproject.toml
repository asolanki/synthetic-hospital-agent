[project]
name = "synthetic-hospital-dx"
version = "0.1.0"
description = "synthetic-hospital-dx — Synthetic Hospital patient_diagnosis played through the simulator's /env route."
requires-python = ">=3.11"
dependencies = ["verifiers", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthetic_hospital_dx"]
