# Agent eval of patient_diagnosis through Verifiers, against an OpenRouter model.
# Run from the repo root; write outputs under runs/ (gitignored):
#   set -a; source .env; set +a
#   uv run vf-eval @ training/configs/eval_openrouter.toml -n 5 --output-dir runs/vf-<name>
model = "qwen/qwen3-30b-a3b-instruct-2507"
num_rollouts = 1
push = false

[client]
base_url = "https://openrouter.ai/api/v1"
api_key_var = "OPENROUTER_API_KEY"

[sampling]
temperature = 0.7
top_p = 0.8
max_tokens = 2048

[env.taskset]
id = "synthetic-hospital-dx"
split = "dev"
budget = 40

[env.agent]
max_turns = 50

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
