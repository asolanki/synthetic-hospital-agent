# Augmented harness: Qwen3-30B with the optional `icd10_search` code-book tool, at the controls of
# the harness-gap /env arm (temperature 0, 16,384 max tokens; audit/harness_gap_env.toml) so the
# two runs differ only by the tool. Fixed 120 dev patients.
model = "qwen/qwen3-30b-a3b-instruct-2507"
num_rollouts = 1
push = false

[client]
base_url = "https://openrouter.ai/api/v1"
api_key_var = "OPENROUTER_API_KEY"

[sampling]
temperature = 0.0
max_tokens = 16384

[env.taskset]
id = "synthetic-hospital-dx"
split = "dev"
budget = 40

[env.taskset.task]
icd10_tool = true

[env.agent]
max_turns = 50

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"
